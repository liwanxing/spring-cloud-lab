server:
  port: 8088

# 网关侧 sa-token：只校验不签发。token-name 必须与 lab-user 完全一致 ——
# sa-token 的 Redis key 前缀由 tokenName 拼出（Authorization:login:token:xxx），不一致就查不到会话
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800

spring:
  application:
    name: lab-gateway
  data:
    redis:            # 与业务服务同一个 Redis（sa-token 会话在里）：网关校验 token → userId 映射
      host: localhost
      port: 6380
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: lab-user
          uri: lb://lab-user
          predicates:
            - Path=/api/users/**,/api/auth/**
        - id: lab-product
          uri: lb://lab-product
          predicates:
            - Path=/api/products/**
        - id: lab-order-cart
          uri: lb://lab-order
          predicates:
            - Path=/api/cart/**
        - id: lab-order
          uri: lb://lab-order
          predicates:
            - Path=/api/orders/**,/api/payments/**
