spring:
  config:
    # 本地密钥配置（不入版本库，参考 application-local.yml.example）
    import: optional:classpath:application-local.yml
  application:
    name: lab-order
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
  datasource:
    # 拆库后各服务独立库+独立账号（账号=库名，最小权限）
    url: jdbc:mysql://localhost:3307/cloud_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: cloud_order
    password: cloud123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6380

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8082

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  redis:
    host: localhost
    port: 6380

# XXL-Job 执行器：appname 与控制台「执行器管理」的 AppName 对应，accessToken 与调度中心一致
# 执行器独立端口 9999（调度中心回调直达，不经网关）
xxl:
  job:
    admin:
      addresses: http://localhost:8181/xxl-job-admin
    executor:
      appname: lab-order-executor
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 7
    accessToken: default_token

# 超时关单：PENDING 超过该分钟数未支付则自动关闭，控制台任务参数可临时覆盖
order:
  pay-timeout-minutes: 15

# 支付配置：channel 可选 alipay / mock（未配置时默认 mock）
# 密钥三项（app-id / merchant-private-key / alipay-public-key）由 application-local.yml 或环境变量提供
payment:
  channel: alipay
  alipay:
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    # 异步回调公网地址（natapp 免费隧道，重启客户端域名会变，变了需同步更新）
    notify-url: http://d3aa5588.natappfree.cc/api/payments/notify
    return-url: http://localhost:5174/orders
    app-id: ${ALIPAY_APP_ID:}
    merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
