spring:
  config:
    # 本地密钥配置（不入版本库，参考 application-local.yml.example）
    import: optional:classpath:application-local.yml
  application:
    name: lab-order
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    # Sentinel 限流熔断（SCA 配置键必须挂 spring.cloud.sentinel 下，写成顶层 sentinel 会被静默无视）：
    # eager 启动即向控制台注册；默认懒加载需先有流量才连
    sentinel:
      eager: true
      transport:
        dashboard: localhost:8858
      # 规则持久化：正本存 Nacos 配置中心（dataId 按服务名区分），启动拉取 + 监听变更秒生效；
      # dashboard 降为观察窗（它改的规则只进内存，重启即丢 —— 改规则去 Nacos 控制台改）
      datasource:
        flow-rules:
          nacos:
            server-addr: localhost:8848
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: localhost:8848
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
    # Feign 超时精细配置（C阶段）：Spring Cloud 2023 起前缀从 feign.client.config 迁到 spring.cloud.openfeign.client.config
    # 默认值 connect 10s / read 60s 太宽：lab-product 挂时应快速失败走降级，而不是干等 10 秒拖死下单线程
    openfeign:
      client:
        config:
          default:                # 全局兑底（对以后新增的 Feign 客户端生效）
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: BASIC   # 每次调用一行：方法+URL+状态码+耗时，随 ELK 进 Kibana 可查跨服务调用耗时
          lab-product:            # 下单链路专属覆盖：扣库存走 Seata 全局锁，锁竞争时偏慢，读超时放宽
            connect-timeout: 2000
            read-timeout: 8000
    # 重试刻意不配：Spring Cloud OpenFeign 默认 Retryer.NEVER_RETRY 正是想要的 ——
    # ProductFeignClient 混有 deduct/restore 非幂等写操作，自动重试可能重复扣库存；
    # 失败兑底交给 Sentinel 熔断 + ProductFeignFallback（注：原生 OpenFeign 默认反而会重试 5 次，是 Spring Cloud 改成不重试的）
  datasource:
    # 拆库后各服务独立库+独立账号（账号=库名，最小权限）
    url: jdbc:mysql://localhost:3307/cloud_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: cloud_order
    password: cloud123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6380

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Seata AT 分布式事务：直连 TC（file 模式无注册中心），事务分组 -> TC 集群 -> 地址三层映射
# 数据源代理默认开启，undo_log 表在 cloud_order 库
seata:
  tx-service-group: lab_tx_group
  service:
    vgroup-mapping:
      lab_tx_group: default
    grouplist:
      default: localhost:8091

# Feign 整合 Sentinel：开启后 Feign 调用可配 fallback 降级（商品服务挂时返回友好错误而非报错堆栈）
feign:
  sentinel:
    enabled: true

# Feign 调用日志开关：openfeign 的 logger-level 只决定"打多少内容"，还需对应 logger 开到 DEBUG 才真正输出
logging:
  level:
    com.liwx.laborder.feign: DEBUG

server:
  port: 8082

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  redis:
    host: localhost
    port: 6380

# XXL-Job 执行器：appname 与控制台「执行器管理」的 AppName 对应，accessToken 与调度中心一致
# 执行器独立端口 9999（调度中心回调直达，不经网关）
xxl:
  job:
    admin:
      addresses: http://localhost:8181/xxl-job-admin
    executor:
      appname: lab-order-executor
      port: 9999
      logpath: ./logs/xxl-job
      logretentiondays: 7
    accessToken: default_token

# 超时关单：PENDING 超过该分钟数未支付则自动关闭，控制台任务参数可临时覆盖
order:
  pay-timeout-minutes: 15
  # 延迟消息档位（RocketMQ 经典 18 档：5=1m 14=10m 16=30m）：实验用 5 即 1 分钟到点，生产换 16
  close-delay-level: 5

# RocketMQ：宿主 19876（默认 9876 被另一项目占用）；生产者下单发延迟消息，消费者到点关单
rocketmq:
  name-server: 127.0.0.1:19876
  producer:
    group: lab-order-producer
    send-message-timeout: 5000

# 支付配置：channel 可选 alipay / mock（未配置时默认 mock）
# 密钥三项（app-id / merchant-private-key / alipay-public-key）由 application-local.yml 或环境变量提供
payment:
  channel: alipay
  alipay:
    gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
    # 异步回调公网地址（natapp 免费隧道，重启客户端域名会变，变了需同步更新）
    notify-url: http://d3aa5588.natappfree.cc/api/payments/notify
    return-url: http://localhost:5174/orders
    app-id: ${ALIPAY_APP_ID:}
    merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
