# RocketMQ Broker 配置（本地实验单机模式）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# 对外通告地址：broker 把 brokerIP1:listenPort 注册给 NameServer，客户端拿到后直连。
# 实测宿主访问自身 LAN IP 的映射端口被 Windows 防火墙拦截（127.0.0.1 通、192.168.3.x 不通），
# 故通告 127.0.0.1：宿主 Spring 客户端全通；代价是 dashboard 容器内查消息详情会指向它自己（集群页不受影响）。
# 若需 dashboard 完整可用：管理员 PowerShell 加防火墙入站规则放行 10913/10915/10916 后改回 host.docker.internal
brokerIP1 = 127.0.0.1
listenPort = 10915

brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 实验环境便利项：自动创建主题；消息保留 24h，每天 4 点清理
autoCreateTopicEnable = true
fileReservedTime = 24
deleteWhen = 04
diskMaxUsedSpaceRatio = 95
