# Logstash pipeline：读各服务 JSON 日志行，喂 ES 日索引（ELK 阶段4）
# 三段式 input -> filter -> output 是 Logstash 的固定骨架
input {
  file {
    # 容器内路径：compose 把项目根 logs/ 挂到 /var/log/app/logs
    # 只跟当前文件 app.log（按天滚动的 app.2026-xx-xx.N.log 不重读，避免重复）
    path => "/var/log/app/logs/*/app.log"
    # 首次启动从头读（把已有日志都灌进 ES）；配合宿主 logs/.sincedb 记住进度，
    # 重启后从断点续读，不重复搬运
    start_position => "beginning"
    sincedb_path => "/var/log/app/logs/.sincedb"
    # 每行已是 JSON（logstash-logback-encoder 产物），直接解析成字段
    codec => json
  }
}

filter {
  # 阶段1 遗留的旧纯文本行（换 JSON encoder 之前写入的）解析不了，带 _jsonparsefailure 标签，丢弃
  if "_jsonparsefailure" in [tags] {
    drop { }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # 按天分索引：好清理（留 N 天直接删旧索引）、为 ILM 生命周期管理铺路
    index => "app-logs-%{+YYYY.MM.dd}"
  }
}
