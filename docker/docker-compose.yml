services:
  mysql:
    image: mysql:8.0
    container_name: cloud-mall-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: cloud_mall
      MYSQL_USER: cloudlab
      MYSQL_PASSWORD: cloud123
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect="SET NAMES utf8mb4"

  redis:
    image: redis:7-alpine
    container_name: cloud-mall-redis
    restart: always
    ports:
      - "6380:6379"

  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: cloud-mall-nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
    depends_on:
      - mysql

volumes:
  mysql_data: