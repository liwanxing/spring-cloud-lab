services:
  mysql:
    image: mysql:8.0
    container_name: cloud-mall-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      TZ: Asia/Shanghai
      # 库与账号不再由环境变量初始化：三库三账号（账号=库名）+ cloudlab 观察账号全部由 init.sql 创建
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --init-connect="SET NAMES utf8mb4"

  redis:
    image: redis:7-alpine
    container_name: cloud-mall-redis
    restart: always
    ports:
      - "6380:6379"

  nacos:
    image: nacos/nacos-server:v2.3.1
    container_name: cloud-mall-nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 256m
    depends_on:
      - mysql

  # XXL-Job 调度中心：定时任务统一调度（超时关单等），控制台 http://localhost:8181/xxl-job-admin（admin/123456）
  # 建表脚本：docker/tables_xxl_job.sql（首次启动前导入 mysql）
  # 注：宿主机端口用 8181，8180 已被 rocketmq-dashboard 占用
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.1
    container_name: cloud-xxljob-admin
    restart: always
    ports:
      - "8181:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://cloud-mall-mysql:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=root123
        --xxl.job.accessToken=default_token
    depends_on:
      - mysql
    volumes:
      - xxljob_logs:/data/applogs

  # Seata TC 事务协调器：AT 模式全局事务的大脑（发起方只写 @GlobalTransactional，XID 随 Feign 流转）
  # 控制台 http://localhost:7091（seata/seata）；8091 是客户端通信端口
  # 注：file 模式单机存储，重启丢全局事务状态，适合本地实验；生产换 db/redis 模式
  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: cloud-seata-server
    restart: always
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      STORE_MODE: file

  # RocketMQ NameServer：路由中心（broker 向它注册，客户端从它查路由）
  # 宿主 19876（默认 9876 被另一项目占用，端口整体后移）
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: cloud-rmq-namesrv
    restart: always
    ports:
      - "19876:9876"
    environment:
      TZ: Asia/Shanghai
    command: sh mqnamesrv

  # RocketMQ Broker：消息存储与转发，延迟消息关单的消息引擎
  # broker 把 brokerIP1:listenPort 通告给 NameServer，客户端按此直连 —— 端口必须容器内外 1:1 映射
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: cloud-rmq-broker
    restart: always
    ports:
      - "10913:10913"   # VIP 通道（listenPort-2）
      - "10915:10915"   # 主通信端口（默认 10911 被另一项目占用）
      - "10916:10916"   # HA 同步口（listenPort+1）
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/broker.conf
    environment:
      TZ: Asia/Shanghai
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/broker.conf
    depends_on:
      - rocketmq-namesrv

  # RocketMQ 控制台 http://localhost:8182（8180 被另一项目 dashboard 占用，8181 是本组 xxl-job）
  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:1.0.0
    container_name: cloud-rmq-dashboard
    restart: always
    ports:
      - "8182:8080"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
    depends_on:
      - rocketmq-namesrv

  # Sentinel 控制台 http://localhost:8858（sentinel/sentinel）：限流/熔断规则可视化下发
  # 注：客户端接入后需有流量才在控制台出现（懒注册），规则存控制台内存、重启失效（实验可接受，生产走 Nacos 持久化）
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: cloud-sentinel-dashboard
    restart: always
    ports:
      - "8858:8858"
    environment:
      TZ: Asia/Shanghai

  # Elasticsearch（ELK 阶段3）：日志的存储与检索引擎（倒排索引全文搜索，阶段5 上 Kibana 才有界面）
  # 探活：curl http://localhost:9200；单机模式堆 512m；关闭 xpack 安全认证（实验免密，生产必开）
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: cloud-elasticsearch
    restart: always
    ports:
      - "9200:9200"
    environment:
      TZ: Asia/Shanghai
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  # Logstash（ELK 阶段4）：日志搬运工 —— tail 各服务 app.log（JSON 行）→ 喂 ES 的 app-logs-* 日索引
  # pipeline 配置挂载 docker/logstash/pipeline/；256m 堆（实验流量绰绰有余，默认要 1g）
  # 不对外暴露端口（file 输入不需要，API 9600 仅容器内用），零端口占用
  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    container_name: cloud-logstash
    restart: always
    environment:
      TZ: Asia/Shanghai
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      # rw：Logstash 要在挂载根写 .sincedb 断点文件（重启续读不重复搬运）
      - ../logs:/var/log/app/logs
    depends_on:
      - elasticsearch

  # Kibana（ELK 阶段5）：日志可视化 —— Discover 检索/过滤/看板，http://localhost:5601
  # 与 ES 同版；ES 关了 xpack 认证放 Kibana 免登录（实验环境，生产必开）
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: cloud-kibana
    restart: always
    ports:
      - "5601:5601"
    environment:
      TZ: Asia/Shanghai
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  mysql_data:
  xxljob_logs:
  elasticsearch_data: