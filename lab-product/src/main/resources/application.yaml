spring:
  application:
    name: lab-product
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    # Sentinel 限流熔断（SCA 配置键必须挂 spring.cloud.sentinel 下，写成顶层 sentinel 会被静默无视）：
    # eager 启动即向控制台注册；默认懒加载需先有流量才连
    sentinel:
      eager: true
      transport:
        dashboard: localhost:8858
      # 规则持久化：正本存 Nacos 配置中心（dataId 按服务名区分），启动拉取 + 监听变更秒生效；
      # dashboard 降为观察窗（它改的规则只进内存，重启即丢 —— 改规则去 Nacos 控制台改）
      datasource:
        flow-rules:
          nacos:
            server-addr: localhost:8848
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: flow
        degrade-rules:
          nacos:
            server-addr: localhost:8848
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
  datasource:
    # 拆库后各服务独立库+独立账号（账号=库名，最小权限）
    url: jdbc:mysql://localhost:3307/cloud_product?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: cloud_product
    password: cloud123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6380

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Seata AT 分布式事务：与 lab-order 同组，作为 RM 接收 XID 注册分支事务
# 数据源代理默认开启，undo_log 表在 cloud_product 库
seata:
  tx-service-group: lab_tx_group
  service:
    vgroup-mapping:
      lab_tx_group: default
    grouplist:
      default: localhost:8091

server:
  port: 8081

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  redis:
    host: localhost
    port: 6380
